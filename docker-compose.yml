services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collabboard
      POSTGRES_USER: collabboard
      POSTGRES_PASSWORD: collabboard
    ports:
      - "5433:5432"
    volumes:
      - collabboard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabboard -d collabboard"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
volumes:
  collabboard-data:
