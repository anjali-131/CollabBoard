server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/collabboard}
spring.datasource.username=${DATABASE_USER:collabboard}
spring.datasource.password=${DATABASE_PASSWORD:collabboard}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-ms=${JWT_TTL_MS:86400000}
app.cookie.secure=${COOKIE_SECURE:false}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:5000}
app.mail.from=${MAIL_FROM:collabboard@localhost}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:5173}
